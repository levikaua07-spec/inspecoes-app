<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checklist Dinâmico - Mizu</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    </head>
<body>
    <header>
        <img src="mizuimg.png" alt="Logo">
        <h1 id="tituloArea">Carregando...</h1>
    </header>

    <div class="container">
        <a href="menu.html" class="botao-voltar">← Voltar</a>
        
        <div class="panel">
            <h2>Identificação</h2>
            <div class="grid">
                <div><label>Operador</label><input type="text" id="operador"></div>
                <div><label>Líder</label><input type="text" id="lider"></div>
                <div><label>Data</label><input type="date" id="data"></div>
            </div>
        </div>

        <div class="panel">
            <div class="sessao-titulo">
                <h2>Itens de Inspeção</h2>
                <button id="btnAddItem" style="display:none;" onclick="criarNovoItem()">+ Adicionar Item</button>
            </div>
            <div id="listaItens"></div>
            <button class="finalizar" onclick="finalizarChecklist()">FINALIZAR E SALVAR ESTRUTURA</button>
        </div>
    </div>

    <script>
        
        const urlParams = new URLSearchParams(window.location.search);
        const areaNome = urlParams.get('area');
        document.getElementById("tituloArea").innerText = areaNome;

        
        let chaveStorage = "itens_" + areaNome;
        let itensSalvos = JSON.parse(localStorage.getItem(chaveStorage)) || [];

        function renderizar() {
            const lista = document.getElementById("listaItens");
            lista.innerHTML = "";
            
            if(itensSalvos.length === 0) {
                lista.innerHTML = "<p style='text-align:center;'>Nenhum item cadastrado. Use o botão + Adicionar Item (Modo Admin).</p>";
            }

            itensSalvos.forEach((item, i) => {
               
            });

            if (localStorage.getItem("usuarioLogado") === "admin") {
                document.getElementById("btnAddItem").style.display = "block";
            }
        }

        
        function finalizarChecklist() {
            
            
            localStorage.setItem(chaveStorage, JSON.stringify(itensSalvos));
            alert("Checklist enviado e estrutura salva!");
        }

        window.onload = renderizar;
    </script>
</body>
</html>
