<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Histórico Transporte/Resfriador - Mizu</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <style>
        .card-hist { background: white; border-radius: 8px; padding: 15px; margin-bottom: 15px; border-left: 5px solid #ff7e00; box-shadow: 0 2px 5px rgba(0,0,0,0.1); position: relative; }
        .card-header { font-weight: bold; border-bottom: 1px solid #eee; padding-bottom: 8px; margin-bottom: 8px; display: flex; justify-content: space-between; padding-right: 35px; }
        .detalhes { font-size: 0.9rem; color: #555; line-height: 1.6; }
        .status-anormal { color: #e74c3c; font-weight: bold; }
        .status-normal { color: #2ecc71; }
        
        .btn-apagar-unico {
            position: absolute; top: 10px; right: 10px; background: #fdf0f0; color: #e74c3c; 
            border: 1px solid #fab1b1; border-radius: 6px; width: 30px; height: 30px; 
            cursor: pointer; font-weight: bold; font-size: 16px;
        }

        /* ESTILO DO MODAL BONITÃO */
        .modal-aviso {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); z-index: 10000; align-items: center; justify-content: center;
        }
        .modal-box {
            background: white; width: 85%; max-width: 320px; padding: 25px; 
            border-radius: 15px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        .modal-box h3 { margin-top: 0; color: #2c3e50; }
        .modal-box p { color: #666; margin-bottom: 25px; }
        .modal-botoes { display: flex; gap: 10px; }
        .btn-confirmar { background: #e74c3c; color: white; border: none; flex: 1; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .btn-cancelar { background: #ecf0f1; color: #7f8c8d; border: none; flex: 1; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; }

        .img-historico { display: block; margin-top: 10px; max-width: 100%; border-radius: 6px; border: 1px solid #ddd; }
        .item-separador { margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px dashed #eee; }
        .btn-limpar { background: #7f8c8d; color: white; border: none; padding: 12px; border-radius: 5px; cursor: pointer; width: 100%; margin-top: 20px; }
    </style>
</head>
<body>
    <header>
        <img src="mizuimg.png">
        <h1>Histórico: Transporte e Resfriador</h1>
    </header>

    <div class="container">
        <a href="selecionar_historico.html" class="botao-voltar">← Voltar</a>
        <div id="listaHistorico"></div>
        <button class="btn-limpar" onclick="abrirModalGeral()">Apagar Tudo (Limpeza Geral)</button>
    </div>

    <div id="meuModal" class="modal-aviso">
        <div class="modal-box">
            <h3 id="modalTitulo">Apagar Registro?</h3>
            <p id="modalMensagem">Esta ação não pode ser desfeita.</p>
            <div class="modal-botoes">
                <button class="btn-cancelar" onclick="fecharModal()">Cancelar</button>
                <button class="btn-confirmar" id="btnConfirmarAcao">Sim, Apagar</button>
            </div>
        </div>
    </div>

    <script>
        let indiceParaApagar = null;
        let acaoGeral = false;

        function carregarHistorico() {
            const lista = document.getElementById("listaHistorico");
            lista.innerHTML = "";
            let dados = JSON.parse(localStorage.getItem("historico_resfriador_transporte")) || [];

            if (dados.length === 0) {
                lista.innerHTML = "<p style='text-align:center; color: #999; margin-top: 40px;'>Nenhum registro encontrado.</p>";
                return;
            }

            const dadosInvertidos = [...dados].reverse();

            dadosInvertidos.forEach((reg, indexInvertido) => {
                const indexOriginal = dados.length - 1 - indexInvertido;
                const div = document.createElement("div");
                div.className = "card-hist";
                
                let itensHTML = reg.resultados.map(r => `
                    <div class="item-separador">
                        <strong>${r.titulo}:</strong> 
                        <span class="${r.status === 'Anormal' ? 'status-anormal' : 'status-normal'}">${r.status}</span>
                        ${r.obs ? `<br><small>Obs: ${r.obs}</small>` : ''}
                        ${r.foto ? `<img src="${r.foto}" class="img-historico">` : ''}
                    </div>
                `).join("");

                div.innerHTML = `
                <button class="btn-apagar-unico" onclick="abrirModalIndividual(${indexOriginal})">×</button>
        <div class="card-header">
            <span>${reg.area}</span>
            <span>${reg.data}</span>
        </div>
        <div class="detalhes">
            <strong>Op:</strong> ${reg.operador} | <strong>Turno:</strong> ${reg.turno}<br><br>
            ${itensHTML}
        </div>
                `;
                lista.appendChild(div);
            });
        }

        // FUNÇÕES DO MODAL
        function abrirModalIndividual(index) {
            indiceParaApagar = index;
            acaoGeral = false;
            document.getElementById("modalTitulo").innerText = "Apagar Item?";
            document.getElementById("modalMensagem").innerText = "Deseja remover este checklist específico?";
            document.getElementById("meuModal").style.display = "flex";
        }

        function abrirModalGeral() {
            acaoGeral = true;
            document.getElementById("modalTitulo").innerText = "Apagar TUDO?";
            document.getElementById("modalMensagem").innerText = "CUIDADO: Isso removerá todos os registros desta área!";
            document.getElementById("meuModal").style.display = "flex";
        }

        function fecharModal() {
            document.getElementById("meuModal").style.display = "none";
        }

        document.getElementById("btnConfirmarAcao").onclick = function() {
            if (acaoGeral) {
                localStorage.removeItem("historico_resfriador_transporte");
            } else {
                let dados = JSON.parse(localStorage.getItem("historico_resfriador_transporte")) || [];
                dados.splice(indiceParaApagar, 1);
                localStorage.setItem("historico_resfriador_transporte", JSON.stringify(dados));
            }
            fecharModal();
            carregarHistorico();
        };

        window.onload = carregarHistorico;
    </script>
</body>
</html>
