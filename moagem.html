<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moagem Z1M01</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">

    <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>

    <style>
        #toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); padding: 15px 25px; color: white; border-radius: 8px; display: none; z-index: 9999; font-weight: bold; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.7); justify-content: center; align-items: center; z-index: 9999; }
        .modal-conteudo { background: white; padding: 30px; border-radius: 12px; width: 90%; max-width: 450px; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2); }
        .modal-conteudo h3 { margin-top: 0; margin-bottom: 15px; color: #333; }
        .modal-conteudo input, .modal-conteudo textarea { width: 100%; margin: 10px 0; padding: 10px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        .botoes { display: flex; justify-content: flex-end; gap: 12px; margin-top: 20px; }
        #btnSalvar { background: #2ecc71; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        #btnExcluirConfirm { background: #e74c3c; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        #btnCancelar, #btnExcluirCancelar { background: #95a5a6; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; }
        .btn-editar, .btn-excluir { margin-top: 10px; margin-right: 5px; cursor: pointer; padding: 6px 12px; border: none; border-radius: 4px; font-weight: bold; }
        .btn-excluir { background: #e74c3c; color: white; }
        .btn-editar { background: #3498db; color: white; }
        #btnAdd { background-color: #2ecc71; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; }
    </style>
</head>

<body>
    <div id="toast"></div>
    <header>
        <img src="mizuimg.png" alt="Logo">
        <h1>Moagem Z1M01</h1>
    </header>

    <div class="container">
        <a href="menu.html" class="botao-voltar">← Voltar</a>

        <div class="panel">
            <h2>Identificação</h2>
            <div class="grid">
                <div>
                    <label>Operador</label>
                    <input type="text" id="operador">
                </div>
                <div>
                    <label>Turno</label>
                    <select id="turno">
                        <option>A</option>
                        <option>B</option>
                        <option>C</option>
                        <option>D</option>
                    </select>
                </div>
                <div>
                    <label>Data</label>
                    <input type="date" id="data">
                </div>
            </div>
        </div>

        <div class="panel" id="painelChecklist">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h2 id="tituloPainel" class="titulo-destaque">Itens de Inspeção Z1M01</h2>
                <button id="btnAdd" style="display:none;" onclick="criarNovoItem()">+ Adicionar Item</button>
            </div>
            <div id="listaItens"></div>
            <button class="finalizar" onclick="finalizarChecklist()" style="margin-top: 20px;">FINALIZAR CHECKLIST</button>
        </div>
    </div>

    <div id="modalEditar" class="modal">
        <div class="modal-conteudo">
            <h3>Editar/Criar Item</h3>
            <label>Título:</label><input type="text" id="inputTitulo">
            <label>Descrição:</label><textarea id="inputDescricao" rows="5"></textarea>
            <div class="botoes">
                <button id="btnCancelar">Cancelar</button>
                <button id="btnSalvar">Salvar Alterações</button>
            </div>
        </div>
    </div>

    <div id="modalExcluir" class="modal">
        <div class="modal-conteudo">
            <h3>Confirmar Exclusão</h3>
            <p>Deseja realmente excluir este item?</p>
            <div class="botoes">
                <button id="btnExcluirConfirm">Sim, Excluir</button>
                <button id="btnExcluirCancelar">Não, Manter</button>
            </div>
        </div>
    </div>

    <script>
        let itensData = [];
        let itemAtual = null;
        let itemExcluir = null;

        const atividadesPadrao = [
            { titulo: "Correia Z1A05", descricao: "<b>Situação Esperada:</b><br>Sem desgastes na borracha de vedação lateral, sem emendas danificadas na correia, alinhamento correto, raspador encostando no rolo, roletes livres, chute sem colagem, despoeiramento e emergência ok." },
            { titulo: "Válvula de desvio Z1A04", descricao: "<b>Situação Esperada:</b><br>Posicionada (atuando no sensor), sem furo e vedando a passagem de material para o lado não desejado." },
            { titulo: "Moinho Z1M01", descricao: "<b>Situação Esperada:</b><br>Sem ruídos estranhos, sem vazamento de material, portas vedadas e parafusos do corpo sem folgas." },
            { titulo: "Bombas de óleo do sistema hidráulico", descricao: "<b>Situação Esperada:</b><br>Verificar vazamentos nos mancais de entrada/saída e redutor, óleo no nível correto e circulação de água de refrigeração." },
            { titulo: "Torre de resfriamento KURPER", descricao: "<b>Situação Esperada:</b><br>Água limpa, sem vazamento, bomba e ventilador funcionando, bomba reserva pronta." },
            { titulo: "Sistema de injeção de água", descricao: "<b>Situação Esperada:</b><br>Sem vazamento em tubulações/caixa Bucin, sensores de nível ok, válvulas posicionadas corretamente." },
            { titulo: "Separador Z1S01", descricao: "<b>Situação Esperada:</b><br>Sem ruído estranho, sem vazamento no redutor, válvula pendular ajustada e aberturas de ar conforme processo." },
            { titulo: "Filtro de Processo Z1P01", descricao: "<b>Situação Esperada:</b><br>Sem material acumulado na tremonha, sem ar falso, pressão de limpeza 5-7 bar, batimentos a cada 5s, sem poluir." },
            { titulo: "Eclusas do filtro (Z1U02 e Z1U03)", descricao: "<b>Situação Esperada:</b><br>Sem vazamento, sem barulho estranho, vigia de velocidade e atuador fixos." },
            { titulo: "Regueiras (Z1J02, Z1J06, Z1J09, Z1U12, Z1U07)", descricao: "<b>Situação Esperada:</b><br>Sem material na câmara de ar, registros de aeração ok, fluidização adequada e bolas de desvio desobstruídas." },
            { titulo: "Sopradores", descricao: "<b>Situação Esperada:</b><br>Filtro limpo, sem barulho estranho, sem vazamento de ar e válvulas reguladas." },
            { titulo: "Elevadores (Z1J11, Z1J04)", descricao: "<b>Situação Esperada:</b><br>Sem vazamento, sem ruído, mancais com temperatura normal, giro lento operacional." },
            { titulo: "Purgadores dos balões de ar", descricao: "<b>Situação Esperada:</b><br>Purgando automaticamente e sem presença de água no balão." },
            { titulo: "Coletor de corpos estranhos", descricao: "<b>Situação Esperada:</b><br>Moegas vazias e depósito de metais organizado próximo ao moinho." }
        ];

        (function () { emailjs.init("UehVdmGwtpmcV70Sd"); })();

        async function carregarItensDoBanco() {
            try {
                let { data, error } = await _supabase.from('itens_checklist').select('*').eq('area', 'Moagem Z1M01').order('ordem', { ascending: true });
                if (data.length === 0) {
                    const seed = atividadesPadrao.map((item, index) => ({ area: 'Moagem Z1M01', titulo: item.titulo, descricao: item.descricao, ordem: index + 1 }));
                    const { data: newData } = await _supabase.from('itens_checklist').insert(seed).select();
                    itensData = newData;
                } else { itensData = data; }
                renderItens();
            } catch (err) { console.error(err); }
        }

        function renderItens() {
            const lista = document.getElementById("listaItens");
            lista.innerHTML = "";
            itensData.forEach((item, i) => {
                const div = document.createElement("div");
                div.className = "item";
                div.setAttribute('data-id', item.id);
                div.innerHTML = `
                    <div class="numero">ITEM ${String(i + 1).padStart(2, "0")}</div>
                    <div class="titulo">${item.titulo}</div>
                    <div class="descricao">${item.descricao}</div>
                    <div class="opcoes">
                        <label><input type="radio" name="item${item.id}" value="Normal"> Normal</label>
                        <label><input type="radio" name="item${item.id}" value="Anormal"> Anormal</label>
                    </div>
                    <textarea class="obs" placeholder="Observações"></textarea>
                    <input type="file" class="foto" accept="image/*">
                `;
                lista.appendChild(div);
            });
            if (localStorage.getItem("usuarioLogado") === "admin") adicionarControlesADM();
        }

        function adicionarControlesADM() {
            document.getElementById("btnAdd").style.display = "block";
            document.querySelectorAll(".item").forEach(item => {
                if (item.querySelector(".btn-editar")) return;
                let btnEd = document.createElement("button"); btnEd.innerText = "Editar"; btnEd.className = "btn-editar";
                btnEd.onclick = () => { itemAtual = item; abrirModalEditar(item); };
                let btnEx = document.createElement("button"); btnEx.innerText = "Excluir"; btnEx.className = "btn-excluir";
                btnEx.onclick = () => { itemExcluir = item; document.getElementById("modalExcluir").style.display = "flex"; };
                item.appendChild(btnEd); item.appendChild(btnEx);
            });
        }

        function abrirModalEditar(item) {
            document.getElementById("inputTitulo").value = item.querySelector(".titulo").innerText;
            document.getElementById("inputDescricao").value = item.querySelector(".descricao").innerHTML.replace("<b>Situação Esperada:</b><br>", "");
            document.getElementById("modalEditar").style.display = "flex";
        }

        function criarNovoItem() {
            itemAtual = null;
            document.getElementById("inputTitulo").value = "";
            document.getElementById("inputDescricao").value = "";
            document.getElementById("modalEditar").style.display = "flex";
        }

        document.getElementById("btnSalvar").onclick = async () => {
            const titulo = document.getElementById("inputTitulo").value;
            const descricao = "<b>Situação Esperada:</b><br>" + document.getElementById("inputDescricao").value;
            if (itemAtual && itemAtual.getAttribute('data-id')) {
                await _supabase.from('itens_checklist').update({ titulo, descricao }).eq('id', itemAtual.getAttribute('data-id'));
            } else {
                await _supabase.from('itens_checklist').insert([{ area: 'Moagem Z1M01', titulo, descricao, ordem: itensData.length + 1 }]);
            }
            document.getElementById("modalEditar").style.display = "none";
            carregarItensDoBanco();
        };

        document.getElementById("btnExcluirConfirm").onclick = async () => {
            if (itemExcluir) {
                await _supabase.from('itens_checklist').delete().eq('id', itemExcluir.getAttribute('data-id'));
                document.getElementById("modalExcluir").style.display = "none";
                carregarItensDoBanco();
            }
        };

        async function finalizarChecklist() {
            let operador = document.getElementById("operador").value;
            let turno = document.getElementById("turno").value;
            let data = document.getElementById("data").value;
            let itensHTML = document.querySelectorAll(".item");
            let erro = false;

            if (!operador || !data) { mostrarToast("Preencha a Identificação", "erro"); return; }

            let resultadosArray = [];
            let textoEmail = "";

            for (let item of itensHTML) {
                let radio = item.querySelector("input:checked");
                if (!radio) { item.style.border = "2px solid red"; erro = true; }
                else {
                    item.style.border = "none";
                    let fotoInput = item.querySelector(".foto");
                    let imagemBase64 = fotoInput.files[0] ? await toBase64(fotoInput.files[0]) : "";
                    resultadosArray.push({ titulo: item.querySelector(".titulo").innerText, status: radio.value, obs: item.querySelector(".obs").value, foto: imagemBase64 });
                    textoEmail += `${item.querySelector(".titulo").innerText}: ${radio.value} | `;
                }
            }

            if (erro) { mostrarToast("Responda todos os itens", "erro"); return; }

            const { error } = await _supabase.from('inspecoes').insert([{ area: "Moagem Z1M01", operador, turno, data_checklist: data, resultados: resultadosArray }]);

            if (!error) {
                localStorage.setItem("status_Moagem Z1M01", new Date().toLocaleDateString('pt-BR'));
                emailjs.send("service_u1dl3tq", "template_zekwc0r", { operador, area: "Moagem Z1M01", data, resultados: textoEmail });
                mostrarToast("Finalizado com Sucesso!");
                setTimeout(() => window.location.href = "menu.html", 2000);
            }
        }

        const toBase64 = file => new Promise((resolve, reject) => {
            const reader = new FileReader(); reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result); reader.onerror = error => reject(error);
        });

        function mostrarToast(msg, tipo = "ok") {
            let t = document.getElementById("toast"); t.innerText = msg;
            t.style.background = tipo === "erro" ? "#e74c3c" : "#2ecc71";
            t.style.display = "block"; setTimeout(() => t.style.display = "none", 2500);
        }

        document.getElementById("btnCancelar").onclick = () => document.getElementById("modalEditar").style.display = "none";
        document.getElementById("btnExcluirCancelar").onclick = () => document.getElementById("modalExcluir").style.display = "none";

        window.onload = carregarItensDoBanco;
    </script>
</body>

</html>
