<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caixa de Água - Moagem de Cru</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>

    <style>
        #toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); padding: 15px 25px; color: white; border-radius: 8px; display: none; z-index: 9999; font-weight: bold; font-family: sans-serif; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.7); justify-content: center; align-items: center; z-index: 9999; font-family: sans-serif; }
        .modal-conteudo { background: white; padding: 30px; border-radius: 12px; width: 90%; max-width: 450px; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2); }
        .modal-conteudo input, .modal-conteudo textarea { width: 100%; margin: 10px 0; padding: 10px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        .botoes { display: flex; justify-content: flex-end; gap: 12px; margin-top: 20px; }
        #btnSalvar { background: #2ecc71; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        #btnExcluirConfirm { background: #e74c3c; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        #btnCancelar, #btnExcluirCancelar { background: #95a5a6; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; }
        .btn-editar, .btn-excluir { margin-top: 10px; margin-right: 5px; cursor: pointer; padding: 6px 12px; border: none; border-radius: 4px; font-weight: bold; }
        .btn-excluir { background: #e74c3c; color: white; }
        .btn-editar { background: #3498db; color: white; }
        #btnAddItem { background-color: #2ecc71; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; display: none; font-weight: bold; }
        .sessao-titulo { background: #f8f9fa; padding: 12px; margin-top: 10px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>

<body>
    <div id="toast"></div>
    <header>
        <img src="mizuimg.png" alt="Logo">
        <h1>Caixa de Água (Moagem de Cru)</h1>
    </header>

    <div class="container">
        <a href="menu.html" class="botao-voltar">← Voltar</a>

        <div class="panel">
            <h2>Identificação</h2>
            <div class="grid">
                <div><label>Operador</label><input type="text" id="operador"></div>
                <div>
                    <label>Turno</label>
                    <select id="turno">
                        <option>A</option><option>B</option><option>C</option><option>D</option>
                    </select>
                </div>
                <div><label>Data</label><input type="date" id="data"></div>
            </div>
        </div>

        <div class="panel">
            <div class="sessao-titulo">
                <h2 class="titulo-destaque" style="margin:0;">Itens de Inspeção</h2>
                <button id="btnAddItem" onclick="abrirModalCriar()">+ Adicionar Item</button>
            </div>
            <div id="listaItens"></div>
            <button id="btnFinalizar" class="finalizar" onclick="finalizarChecklist()" style="margin-top: 30px;">
                FINALIZAR CHECKLIST
            </button>
        </div>
    </div>

    <div id="modalEditar" class="modal">
        <div class="modal-conteudo">
            <h3 id="modalTitulo">Editar Item</h3>
            <label>Título:</label><input type="text" id="inputTitulo">
            <label>Descrição:</label><textarea id="inputDescricao" rows="5"></textarea>
            <div class="botoes">
                <button id="btnCancelar">Cancelar</button>
                <button id="btnSalvar">Salvar</button>
            </div>
        </div>
    </div>

    <div id="modalExcluir" class="modal">
        <div class="modal-conteudo">
            <h3>Confirmar Exclusão</h3>
            <p>Deseja realmente excluir este item?</p>
            <div class="botoes">
                <button id="btnExcluirConfirm">Sim, Excluir</button>
                <button id="btnExcluirCancelar">Não, Manter</button>
            </div>
        </div>
    </div>

    <script>
        // IDENTIFICAÇÃO INTEGRADA AO TRILHO DA MOAGEM
        const AREA_BANCO = "Caixa de Água Industrial"; // Nome na tabela de itens
        const AREA_HISTORICO = "Caixa de Água Industrial"; // Nome para salvar no histórico/status
        
        let itensData = [];
        let itemAtual = null;

        (function () { emailjs.init("UehVdmGwtpmcV70Sd"); })();

        async function carregarItens() {
            const { data, error } = await _supabase.from('itens_checklist').select('*').eq('area', AREA_BANCO).order('ordem', { ascending: true });
            itensData = data || [];
            renderizarItens();
        }

        function renderizarItens() {
            const lista = document.getElementById("listaItens");
            lista.innerHTML = "";
            itensData.forEach((item, i) => {
                const div = document.createElement("div");
                div.className = "item";
                div.innerHTML = `
                    <div class="numero">ITEM ${String(i + 1).padStart(2, "0")}</div>
                    <div class="titulo">${item.titulo}</div>
                    <div class="descricao"><b>Situação Esperada:</b><br>${item.descricao}</div>
                    <div class="opcoes">
                        <label><input type="radio" name="item_${item.id}" value="Normal"> Normal</label>
                        <label><input type="radio" name="item_${item.id}" value="Anormal"> Anormal</label>
                    </div>
                    <textarea class="obs" placeholder="Observações"></textarea>
                    <input type="file" class="foto" accept="image/*" capture="environment">
                `;
                lista.appendChild(div);
            });
            if (localStorage.getItem("usuarioLogado") === "admin") adicionarControlesADM();
        }

        async function uploadFoto(arquivo) {
            if (!arquivo) return "";
            const nomeArquivo = `${Date.now()}_${Math.random().toString(36).substring(7)}.jpg`;
            const { error } = await _supabase.storage.from('fotos_checklists').upload(nomeArquivo, arquivo);
            if (error) return "";
            const { data } = _supabase.storage.from('fotos_checklists').getPublicUrl(nomeArquivo);
            return data.publicUrl;
        }

        async function finalizarChecklist() {
            const btn = document.getElementById("btnFinalizar");
            let operador = document.getElementById("operador").value;
            let turno = document.getElementById("turno").value;
            let data = document.getElementById("data").value;

            if (!operador || !data) { mostrarToast("Preencha Operador e Data", "erro"); return; }

            let itensHTML = document.querySelectorAll(".item");
            let resultadosArray = [];
            let resumoEmail = "";

            btn.disabled = true; btn.innerText = "ENVIANDO...";

            for (let i = 0; i < itensHTML.length; i++) {
                let radio = itensHTML[i].querySelector("input:checked");
                if (!radio) {
                    itensHTML[i].scrollIntoView({ behavior: 'smooth', block: 'center' });
                    mostrarToast("Responda todos os itens", "erro");
                    btn.disabled = false; btn.innerText = "FINALIZAR CHECKLIST";
                    return;
                }
                
                let fotoInput = itensHTML[i].querySelector(".foto");
                let urlFoto = fotoInput.files[0] ? await uploadFoto(fotoInput.files[0]) : "";

                resultadosArray.push({
                    titulo: itensData[i].titulo,
                    status: radio.value,
                    obs: itensHTML[i].querySelector(".obs").value,
                    foto: urlFoto
                });
                resumoEmail += `${itensData[i].titulo}: ${radio.value} | `;
            }

            // SALVANDO NO SUPABASE COM AREA "Moagem de Cru" para unificar histórico
            const { error } = await _supabase.from('inspecoes').insert([{
                area: AREA_HISTORICO,
                operador: operador,
                turno: turno,
                data_checklist: data,
                resultados: resultadosArray
            }]);

            if (!error) {
                // ATUALIZA O CARD NO MENU (Fica verde)
                localStorage.setItem(`status_${AREA_HISTORICO}`, new Date().toLocaleDateString('pt-BR'));
                
                // SALVA NO HISTÓRICO LOCAL (Se você usar a página de histórico/cards)
                let hist = JSON.parse(localStorage.getItem("historico_resfriador_transporte")) || [];
                hist.push({ area: AREA_HISTORICO, operador, turno, data, resultados: resultadosArray });
                localStorage.setItem("historico_resfriador_transporte", JSON.stringify(hist));

                await emailjs.send("service_u1dl3tq", "template_zekwc0r", {
                    operador, area: AREA_HISTORICO + " (Caixa Água)", data, resultados: resumoEmail
                });

                mostrarToast("Salvo no histórico da Moagem!");
                setTimeout(() => window.location.href = "menu.html", 1500);
            } else {
                mostrarToast("Erro ao salvar", "erro");
                btn.disabled = false; btn.innerText = "FINALIZAR CHECKLIST";
            }
        }

        // --- FUNÇÕES ADM ---
        function adicionarControlesADM() {
            document.getElementById("btnAddItem").style.display = "block";
            document.querySelectorAll(".item").forEach((item, index) => {
                let btnEd = document.createElement("button"); btnEd.innerText = "Editar"; btnEd.className = "btn-editar";
                btnEd.onclick = () => abrirModalEditar(itensData[index]);
                let btnEx = document.createElement("button"); btnEx.innerText = "Excluir"; btnEx.className = "btn-excluir";
                btnEx.onclick = () => abrirModalExcluir(itensData[index]);
                item.appendChild(btnEd); item.appendChild(btnEx);
            });
        }

        function abrirModalEditar(item) {
            itemAtual = item;
            document.getElementById("modalTitulo").innerText = "Editar Item";
            document.getElementById("inputTitulo").value = item.titulo;
            document.getElementById("inputDescricao").value = item.descricao;
            document.getElementById("modalEditar").style.display = "flex";
        }

        function abrirModalCriar() {
            itemAtual = null;
            document.getElementById("modalTitulo").innerText = "Novo Item";
            document.getElementById("inputTitulo").value = "";
            document.getElementById("inputDescricao").value = "";
            document.getElementById("modalEditar").style.display = "flex";
        }

        document.getElementById("btnSalvar").onclick = async () => {
            const titulo = document.getElementById("inputTitulo").value;
            const descricao = document.getElementById("inputDescricao").value;
            if (itemAtual) {
                await _supabase.from('itens_checklist').update({ titulo, descricao }).eq('id', itemAtual.id);
            } else {
                await _supabase.from('itens_checklist').insert([{ area: AREA_BANCO, titulo, descricao, ordem: itensData.length + 1 }]);
            }
            document.getElementById("modalEditar").style.display = "none";
            carregarItens();
        };

        function abrirModalExcluir(item) {
            document.getElementById("modalExcluir").style.display = "flex";
            document.getElementById("btnExcluirConfirm").onclick = async () => {
                await _supabase.from('itens_checklist').delete().eq('id', item.id);
                document.getElementById("modalExcluir").style.display = "none";
                carregarItens();
            };
        }

        function mostrarToast(msg, tipo) {
            let t = document.getElementById("toast"); t.innerText = msg;
            t.style.background = tipo === "erro" ? "#e74c3c" : "#2ecc71";
            t.style.display = "block"; setTimeout(() => t.style.display = "none", 2500);
        }

        document.getElementById("btnCancelar").onclick = () => document.getElementById("modalEditar").style.display = "none";
        document.getElementById("btnExcluirCancelar").onclick = () => document.getElementById("modalExcluir").style.display = "none";

        window.onload = carregarItens;
    </script>
</body>
</html>
