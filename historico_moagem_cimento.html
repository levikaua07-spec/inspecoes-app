<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Histórico Moagem de Cimento - Mizu</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>

    <style>
        .card-hist { background: white; border-radius: 8px; padding: 15px; margin-bottom: 15px; border-left: 5px solid #2ecc71; box-shadow: 0 2px 5px rgba(0,0,0,0.1); position: relative; }
        .card-header { font-weight: bold; border-bottom: 1px solid #eee; padding-bottom: 8px; margin-bottom: 8px; display: flex; justify-content: space-between; padding-right: 35px; }
        .detalhes { font-size: 0.9rem; color: #555; line-height: 1.6; }
        .status-anormal { color: #e74c3c; font-weight: bold; }
        .status-normal { color: #2ecc71; }
        .btn-apagar-unico { position: absolute; top: 10px; right: 10px; background: #fdf0f0; color: #e74c3c; border: 1px solid #fab1b1; border-radius: 6px; width: 30px; height: 30px; cursor: pointer; font-weight: bold; display: flex; align-items: center; justify-content: center; }
        .modal-aviso { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 10000; align-items: center; justify-content: center; }
        .modal-box { background: white; width: 85%; max-width: 320px; padding: 25px; border-radius: 15px; text-align: center; }
        .modal-botoes { display: flex; gap: 10px; margin-top: 20px; }
        .btn-confirmar { background: #e74c3c; color: white; border: none; flex: 1; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .btn-cancelar { background: #ecf0f1; color: #7f8c8d; border: none; flex: 1; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .img-historico { display: block; margin-top: 10px; max-width: 100%; border-radius: 6px; border: 1px solid #ddd; }
        .item-separador { margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px dashed #eee; }
        
        .btn-limpar { background: #7f8c8d; color: white; border: none; padding: 12px; border-radius: 5px; cursor: pointer; width: 100%; margin-top: 20px; }
    </style>
</head>
<body>
    <header>
        <img src="mizuimg.png">
        <h1>Histórico: Moagem de Cimento</h1>
    </header>

    <div class="container">
        <a href="menu.html" class="botao-voltar">← Voltar</a>
        <div id="listaHistorico"></div>
        <button class="btn-limpar" onclick="abrirModalGeral()">Apagar Tudo</button>
    </div>

    <div id="meuModal" class="modal-aviso">
        <div class="modal-box">
            <h3 id="modalTitulo">Apagar Registro?</h3>
            <p id="modalMensagem">Esta ação apagará o registro permanentemente do banco de dados.</p>
            <div class="modal-botoes">
                <button class="btn-cancelar" onclick="fecharModal()">Cancelar</button>
                <button class="btn-confirmar" id="btnConfirmarAcao">Sim, Apagar</button>
            </div>
        </div>
    </div>

    <script>
        let idParaApagar = null;
        let acaoGeral = false; 

        const areasCimento = [
            'Silo Metálico', 
            'Alimentação', 
            'Alimentação da Moagem', 
            'Silo Multicâmara', 
            'Moagem Z1M01',
            'Expedição'
        ];

        async function carregarHistorico() {
            const lista = document.getElementById("listaHistorico");
            lista.innerHTML = "<p style='text-align:center;'>Carregando registros da nuvem...</p>";
            
            try {
                const { data, error } = await _supabase
                    .from('inspecoes')
                    .select('*')
                    .in('area', areasCimento)
                    .order('created_at', { ascending: false });

                if (error) throw error;

                lista.innerHTML = "";

                if (!data || data.length === 0) {
                    lista.innerHTML = "<p style='text-align:center; color: #999; margin-top: 40px;'>Nenhum registro encontrado.</p>";
                    return;
                }

                data.forEach((reg) => {
                    const div = document.createElement("div");
                    div.className = "card-hist";
                    
                    const dataFormatada = reg.data_checklist ? reg.data_checklist.split('-').reverse().join('/') : '---';

                    let itensHTML = "";
                    if (reg.resultados && Array.isArray(reg.resultados)) {
                        itensHTML = reg.resultados.map(r => `
                            <div class="item-separador">
                                <strong>${r.titulo}:</strong> 
                                <span class="${r.status === 'Anormal' ? 'status-anormal' : 'status-normal'}">${r.status}</span>
                                ${r.obs ? `<br><small>Obs: ${r.obs}</small>` : ''}
                                ${r.foto ? `<img src="${r.foto}" class="img-historico">` : ''}
                            </div>
                        `).join("");
                    }

                    div.innerHTML = `
                        <button class="btn-apagar-unico" onclick="abrirModalIndividual('${reg.id}')">×</button>
                        <div class="card-header">
                            <span style="color: #3498db;">${reg.area}</span> 
                            <span>${dataFormatada}</span>
                        </div>
                        <div class="detalhes">
                            <strong>Op:</strong> ${reg.operador} | <strong>Turno:</strong> ${reg.turno}<br><br>
                            ${itensHTML}
                        </div>
                    `;
                    lista.appendChild(div);
                });
            } catch (err) {
                console.error("Erro ao carregar:", err);
                lista.innerHTML = "<p style='text-align:center; color: red;'>Erro ao conectar com o banco de dados.</p>";
            }
        }

        function abrirModalIndividual(id) { 
            idParaApagar = id; 
            acaoGeral = false;
            document.getElementById("modalTitulo").innerText = "Apagar Registro?";
            document.getElementById("meuModal").style.display = "flex"; 
        }

        function abrirModalGeral() { 
            acaoGeral = true; 
            document.getElementById("modalTitulo").innerText = "Apagar TUDO?";
            document.getElementById("meuModal").style.display = "flex"; 
        }

        function fecharModal() { 
            document.getElementById("meuModal").style.display = "none"; 
            idParaApagar = null;
        }

        document.getElementById("btnConfirmarAcao").onclick = async function() {
            try {
                if (acaoGeral) {
                    
                    await _supabase.from('inspecoes').delete().in('area', areasCimento);
                } else if (idParaApagar) {
                    await _supabase.from('inspecoes').delete().eq('id', idParaApagar);
                }
                
                fecharModal();
                carregarHistorico();
            } catch (err) {
                console.error("Erro ao apagar:", err);
                alert("Erro ao excluir do banco.");
            }
        };

        window.onload = carregarHistorico;
    </script>
</body>
</html>
